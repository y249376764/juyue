 }

body {

.box {

	bottom: 0px;

	right: 0;

	overflow: hidden;
	background-color: transparent;
	perspective: 1000px;

.bg_img {
	overflow: hidden;
	width: 110%;
	height: 110%;
	position: absolute;
	z-index: 1;
	left: -5%;
	top: -5%;
	transform-style: preserve-3d;

	height: 100%;
	position: absolute;
	left: 0px;
	top: 0px;

	bottom: 0px;

	background: var(--mask_toTop);
	z-index: 3;
	border-radius: 15px 15px 0 0;

	width: 110%;
	height: 110%;
	left: -5%;
	top: -5%;
	object-position: 50% 40%;
	object-fit: cover;
	filter: blur(0px);
	position: absolute;
	transform-style: preserve-3d;
	backface-visibility: hidden;
	will-change: transform;

	filter: blur(0px) !important;

/* 低分辨率图片保持模糊 */

	filter: blur(2px) !important;

	opacity: .2;

img{

function applyDarkModeStyles() {
	const isPktDevice = /p/i.test(navigator.userAgent);
	const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
	if (isDarkMode) {
		let darkColor = getComputedStyle(document.documentElement).getPropertyValue('--mask_toTop').trim().match(/#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{3})\b/)?.[0];
		let color = request(Invert_color)|| darkColor;
		document.documentElement.classList.add('dark-mode-pkt');
		document.documentElement.style.setProperty('--mask_toTop', `linear-gradient(to top, ${color}, transparent 100%)`);
	}
}

document.querySelectorAll('.meta-item').forEach((item, index) => {
	const container = item.parentElement;
	const textWidth = item.scrollWidth;
	const containerWidth = container.clientWidth;

	if (textWidth > containerWidth) {
		item.style.animation = 'none';
		const clone = item.cloneNode(true);
		clone.classList.add('clone');
		container.appendChild(clone);
		container.style.display = 'flex';
		container.style.overflow = 'hidden';
		const totalWidth = textWidth;
		const speedPerPixel = 0.06;
		const duration = Math.max(totalWidth * speedPerPixel, 20);
		const keyframeName = `seamlessScroll-${index}`;
		const style = document.createElement('style');
		style.textContent = `
			@keyframes ${keyframeName} {
				0%   { transform: translateX(0); }
				100% { transform: translateX(-${totalWidth}px); }
			}
		`;
		document.head.appendChild(style);
		item.style.animation = `${keyframeName} ${duration}s linear infinite`;
		clone.style.animation = `${keyframeName} ${duration}s linear infinite`;
	}
});



function fitTitleFontSize() {
	const title = document.getElementById('title');
	const lineHeight = parseFloat(getComputedStyle(title).lineHeight);
	const maxLines = 2;
	const maxHeight = lineHeight * maxLines;

	let fontSize = 21;
	title.style.fontSize = fontSize + 'px';

	while (title.offsetHeight > maxHeight && fontSize > 10) {
		fontSize--;
		title.style.fontSize = fontSize + 'px';
	}
}

function Seek() {
	$$$().x5LazyRule((height_set,MaxH) => {
		const hikerPop = $.require("https://cdn.jsdelivr.net/gh/y249376764/juyue@main/assets/weisyr/js/hikerPop.js");
		let percent = JSON.parse(request(height_set)||'39');

		hikerPop.seekCenter({
			title: "设置海报高度",
			max: 61,
			pos: percent-39,
			onChange(pos, max, fromHtml) {
				let trueRes = String(pos + 39);
				let api = Math.ceil(trueRes/100*MaxH)
				refreshX5Desc('list&&'+api);
				return fromHtml("当前：" + ((pos + 39) + "%").fontcolor("red"));
			},
			rightClick(pos, max) {
				let trueRes = String(pos + 39);
				let api = Math.ceil(trueRes/100*MaxH)
				refreshX5Desc('list&&'+api);
				writeFile(height_set, JSON.stringify(trueRes));
				setItem("seek", trueRes);
				toast("已将高度度设置为：" + trueRes+'%');
			},
		});
	},height_set,MaxH)
}

function readCaseList() {
	try {
		return JSON.parse(request(CASE_FILE) || '[]');
	} catch (e) {
		return [];
	}
}

function getBookmarkKey(item) {
	const t = item.title || '';
	const i = item.params.url.split('&')[0] || '';
	return 'bk_' + t + '|' + i
}

function isCaseExists(newItem) {
	if(typeof newItem == 'string') {
		newItem = JSON.parse(newItem)
	}
	const newKey = getBookmarkKey(newItem);
	return readCaseList().some(it => getBookmarkKey(it) === newKey);
}
function syncTitleStar(force) {
	$('#title').find('small.star').remove();
	if (force) {
	}
	renderBottomIcon();
}

function CaseOnce(newItem) {
	if(typeof newItem == 'string') newItem = JSON.parse(newItem);
	if (!newItem || !newItem.title) return false;

	const key  = getBookmarkKey(newItem);
	let list = readCaseList();
	const idx  = list.findIndex(it => getBookmarkKey(it) === key);

	if (idx !== -1) {
		list.splice(idx, 1);
		ToastMgr('已删除收藏');
		$('#title').find('small.star').remove();
	} else {
		list.unshift(newItem);
		ToastMgr('已加入书架');
	}

	fba.writeFile(CASE_FILE, JSON.stringify(list));
	renderBottomIcon();
	return true;
}

const setupGyroEffectStr = `
(function setupGyroEffect() {
	const bgImg  = document.querySelector('.bg_img');
	const img	= document.getElementById('img');
	const imgTop = document.getElementById('imgTop');

	if (!bgImg || !img || !imgTop) return;

	let lastX = 0, lastY = 0;
	let targetX = 0, targetY = 0;

	const SENSE_GAMMA = 0.15;
	const SENSE_BETA  = 0.15;
	const FOREGROUND_FACTOR = 0.2;
	const DAMPING	 = 0.055;
	const MAX_TILT	= 6;

	function handleOrientation(e) {
		let gamma = e.gamma || 0;
		let beta  = e.beta  || 0;

		gamma = Math.max(-MAX_TILT, Math.min(MAX_TILT, gamma));
		beta  = Math.max(-MAX_TILT, Math.min(MAX_TILT, beta));

		targetX = gamma * SENSE_GAMMA;
		targetY = beta  * SENSE_BETA;
	}

	if (window.DeviceOrientationEvent) {
		window.addEventListener('deviceorientation', handleOrientation);
	} else {
		window.addEventListener('mousemove', e => {
			const cx = window.innerWidth / 2;
			const cy = window.innerHeight / 2;
			targetX = (e.clientX - cx) *  0.03;
			targetY = (e.clientY - cy) *  0.02;
		});
	}

	function animate() {
		lastX += (targetX - lastX) * DAMPING;
		lastY += (targetY - lastY) * DAMPING;

		const bgX = lastX * 6;
		const bgY = lastY * 4;
		const fgX = lastX * 6 * FOREGROUND_FACTOR;
		const fgY = lastY * 4 * FOREGROUND_FACTOR;

		bgImg.style.transform =
			'rotateX(' + (-lastY * 0.9) + 'deg) ' +
			'rotateY(' + ( lastX * 0.9) + 'deg) ' +
			'translateX(' + bgX + 'px) ' +
			'translateY(' + bgY + 'px)';

		img.style.transform =
			'translateZ(-30px) translateX(' + (bgX * 1.2) + 'px) translateY(' + (bgY * 1.2) + 'px)';

		imgTop.style.transform =
			'translateZ(-10px) translateX(' + fgX + 'px) translateY(' + fgY + 'px)';

		requestAnimationFrame(animate);
	}
	animate();
})();
`;
